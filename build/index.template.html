<title>Booth Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a returning officer's desk — the booth map is the sheet on the left, the tally panel sits to its right; stacks on phones. */
:root {
  --bg: #EEF1F4;
  --panel: #FFFFFF;
  --ink: #141920;
  --ink-2: #4A5361;
  --ink-3: #7D8694;
  --rule: #DCE1E7;
  --sea: #E3EAF0;
  --land: #FAFBFC;
  --coast: #C3CCD6;
  --ghost: #B8C0CA;
  --border: #8E99A8;
  --accent: #0E6F8A;
  --accent-soft: #E1F1F5;
  /* party colours (convention-bound; see notes in README) */
  --p-GRN: #1B7A3A; --p-LAB: #E8434A; --p-TPM: #7E1846; --p-TOP: #12A5A0;
  --p-NZF: #3E4450; --p-NAT: #2563C9; --p-ACT: #E2AE07; --p-OTH: #B9BDC4;
  /* diverging lean: deliberately NOT party colours (purple = Lab/Grn/TPM bloc, orange = Nat/ACT/NZF bloc) */
  --lean-l: #6E48C2; --lean-m: #CDD1D7; --lean-r: #D9731F;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1216; --panel: #151A20; --ink: #E7EBF0; --ink-2: #A8B0BC; --ink-3: #78818E; --rule: #28303A;
    --sea: #0A0E12; --land: #1A2028; --coast: #333C48; --ghost: #3A434F; --border: #5A6575; --accent: #5CC6E2; --accent-soft: #15303A;
    --p-GRN: #2FA352; --p-LAB: #FF6B6B; --p-TPM: #B65196; --p-TOP: #1E9E98;
    --p-NZF: #C9CED6; --p-NAT: #4F8DF0; --p-ACT: #F0C030; --p-OTH: #6B717C;
    --lean-l: #A486F0; --lean-m: #4A525E; --lean-r: #F0954A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1216; --panel: #151A20; --ink: #E7EBF0; --ink-2: #A8B0BC; --ink-3: #78818E; --rule: #28303A;
  --sea: #0A0E12; --land: #1A2028; --coast: #333C48; --ghost: #3A434F; --border: #5A6575; --accent: #5CC6E2; --accent-soft: #15303A;
  --p-GRN: #2FA352; --p-LAB: #FF6B6B; --p-TPM: #B65196; --p-TOP: #1E9E98;
  --p-NZF: #C9CED6; --p-NAT: #4F8DF0; --p-ACT: #F0C030; --p-OTH: #6B717C;
  --lean-l: #A486F0; --lean-m: #4A525E; --lean-r: #F0954A;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; padding-inline: 16px; padding-block: 0 16px; gap: 12px; }

/* ---------- masthead ---------- */
.mast { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 24px; padding-block: 14px 0; }
.mast h1 { margin: 0; font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; text-transform: uppercase; line-height: 1; }
.mast .sub { color: var(--ink-2); font-size: 13px; }
.mast .sub b { font-weight: 600; color: var(--ink); }
.mast .spacer { flex: 1; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; align-items: center; gap: 6px; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
select, input[type=search] { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; min-height: 34px; }
select { padding-right: 24px; max-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 10px; min-height: 32px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

/* ---------- desk ---------- */
.desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 470px); gap: 12px; min-height: 0; }
.mapwrap { position: relative; background: var(--sea); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; min-height: 420px; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }
/* stacking: Leaflet's panes use z-index 200-700, so the basemap gets its own context (0) and everything we draw sits above it */
#basemap { position: absolute; inset: 0; background: var(--sea); z-index: 0; }
#map { z-index: 1; }
.mapbar, .legend, .zoom, .mapnote { z-index: 2; }
.has-basemap #map { pointer-events: none; }
#basemap .leaflet-control-attribution { pointer-events: auto; font-size: 10px; }
.has-basemap .zoom { bottom: 26px; }
.mapnote { position: absolute; left: 50%; transform: translateX(-50%); top: 56px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--ink-2); max-width: calc(100% - 32px); }
.mapbar { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; pointer-events: none; }
.mapbar > * { pointer-events: auto; }
.mapbar .seg { box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel); cursor: pointer; font-size: 16px; line-height: 1; }
.legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in oklab, var(--panel) 92%, transparent); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; font-size: 12px; max-width: min(360px, calc(100% - 70px)); }
.legend .lt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; margin-bottom: 4px; }
.legend .ramp { display: flex; height: 10px; border-radius: 2px; overflow: hidden; gap: 1px; }
.legend .ramp i { flex: 1; }
.legend .ends { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 11px; margin-top: 3px; gap: 12px; }
.legend .keys { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.key { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.legend .note { color: var(--ink-3); font-size: 11px; margin-top: 4px; }

.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; font-size: 12px; width: max-content; max-width: 270px; box-shadow: 0 4px 16px rgb(0 0 0 / .12); }
.tip .t1 { font-weight: 650; font-size: 13px; line-height: 1.25; }
.tip .t2 { color: var(--ink-2); line-height: 1.3; margin-top: 2px; }
.tip .t3 { margin-top: 6px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 6px; align-items: center; }
.tip .t3 .num { text-align: right; }

/* ---------- panel ---------- */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--rule); display: grid; gap: 10px; }
.sec:last-child { border-bottom: 0; }
.eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 650; }
h2 { margin: 0; font-family: var(--f-display); font-stretch: 112%; font-weight: 750; font-size: 21px; line-height: 1.15; text-wrap: balance; }
h3 { margin: 0; font-size: 14px; font-weight: 650; }
p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.muted { color: var(--ink-3); }
.row-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px 1px 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }

/* stacked bar */
.bar { display: flex; gap: 2px; height: 14px; min-width: 0; }
.bar.tall { height: 22px; }
.bar i { display: block; min-width: 1px; border-radius: 1px; position: relative; font-style: normal; font-size: 11px; line-height: 22px; color: #fff; overflow: hidden; white-space: nowrap; text-indent: 5px; font-weight: 600; }
.bar i:first-child { border-radius: 3px 1px 1px 3px; }
.bar i:last-child { border-radius: 1px 3px 3px 1px; }
.barkey { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: var(--ink-2); }
.barkey .num { color: var(--ink); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); padding-inline: 16px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { border: 0; background: none; padding: 10px 10px 9px; cursor: pointer; color: var(--ink-3); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* lists */
.list { display: grid; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(90px, 40%); gap: 4px 10px; align-items: center; padding: 6px 16px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; border-top: 1px solid color-mix(in oklab, var(--rule) 60%, transparent); }
.li:hover, .li.hot { background: color-mix(in oklab, var(--accent-soft) 60%, var(--panel)); }
.li.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.li .nm { min-width: 0; }
.li .nm b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .nm > span { display: block; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .v { text-align: right; font-size: 12px; color: var(--ink-2); }
.listhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px 6px; flex-wrap: wrap; }
.groupt { padding: 12px 16px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 650; }
.badge { font-family: var(--f-mono); font-size: 10.5px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; color: var(--ink-3); margin-right: 4px; }

/* detail card */
.detail { display: grid; gap: 8px; }
.ptable { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 3px 8px; align-items: center; font-size: 12.5px; }
.ptable .num { text-align: right; }
.ptable .pc { color: var(--ink-2); }
.ptable .mini { height: 8px; border-radius: 2px; }
.contrib { font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px; }

/* scatter + matrix */
.chart { width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 10.5px; font-family: var(--f-mono); }
.chart .lab { fill: var(--ink-2); font-family: var(--f-body); font-size: 11px; }
.stat { display: flex; gap: 8px 16px; flex-wrap: wrap; }
.stat > div { flex: 1 1 0; min-width: 90px; }
.stat div { display: grid; }
.stat .big { font-family: var(--f-display); font-stretch: 100%; font-weight: 750; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .cap { font-size: 11.5px; color: var(--ink-3); }
.mx { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
.mx table { border-collapse: separate; border-spacing: 0; font-size: 11.5px; min-width: 100%; }
.mx th, .mx td { padding: 4px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
.mx thead th { position: sticky; top: 0; background: var(--panel); vertical-align: bottom; font-weight: 600; color: var(--ink-2); }
.mx th.rh { text-align: left; position: sticky; left: 0; background: var(--panel); z-index: 1; font-weight: 600; }
.mx td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.mx td.own { box-shadow: inset 0 0 0 2px var(--accent); }
.mx .ch { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.callout { font-size: 12.5px; color: var(--ink-2); background: var(--bg); border-radius: 6px; padding: 8px 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.results { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 6px 20px rgb(0 0 0 / .14); z-index: 10; max-height: 320px; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; cursor: pointer; border-top: 1px solid var(--rule); }
.results button:first-child { border-top: 0; }
.results button:hover, .results button:focus-visible { background: var(--accent-soft); }
.results b { display: block; font-weight: 600; font-size: 13px; }
.results span { color: var(--ink-3); font-size: 11.5px; }
.search { position: relative; }
.search input { width: 240px; max-width: 100%; }

@media (max-width: 900px) {
  .app { height: auto; }
  .desk { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: 62vh; min-height: 360px; }
  .panel { overflow: visible; }
  .search input { width: 100%; }
  .search { flex: 1 1 100%; }
  select { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="mast">
    <div>
      <h1>Booth Inspector</h1>
      <div class="sub">2023 General Election · <b class="num" id="nPlaces"></b> voting places · <b class="num" id="nVotes"></b> party votes</div>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <div class="field">
        <label for="elSel">Electorate</label>
        <select id="elSel"></select>
      </div>
      <div class="search">
        <label class="sr" for="q">Find a voting place</label>
        <input id="q" type="search" placeholder="Find a voting place or suburb" autocomplete="off">
        <div class="results" id="results" hidden></div>
      </div>
    </div>
  </header>

  <main class="desk">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" aria-label="Map of voting places, one dot per voting place sized by votes cast"></canvas>
      <div class="mapbar">
        <div class="seg" role="group" aria-label="Colour voting places by" id="modeSeg"></div>
        <select id="partySel" aria-label="Party to show" hidden></select>
        <div class="seg" role="group" aria-label="Background map" id="bmSeg" hidden>
          <button data-bm="on" aria-pressed="true" title="Detailed street map underneath (needs internet)">Street map</button>
          <button data-bm="off" aria-pressed="false" title="Plain coastline only: much lighter to pan and zoom">Simple · faster</button>
        </div>
        <div class="seg" role="group" aria-label="Which voting places" id="kindSeg">
          <button data-k="all" aria-pressed="true">All</button>
          <button data-k="A" aria-pressed="false">Advance</button>
          <button data-k="E" aria-pressed="false">Election day</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="zoom">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zfit" aria-label="Fit to view" title="Fit to view">⤢</button>
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<script id="data" type="application/json">/*DATA*/</script>
<script id="coast" type="application/json">/*COAST*/</script>
<script id="bounds" type="application/json">/*BOUNDS*/</script>
<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const COAST = JSON.parse(document.getElementById('coast').textContent);
const BOUNDS = JSON.parse(document.getElementById('bounds').textContent);
const P = D.parties;
const NP = P.length;
const pi = n => P.indexOf(n);

// ---------- party groups (fixed order = bar order: opposition bloc, TOP, governing bloc, others) ----------
const G = [
  { k: 'GRN', s: 'Green', f: 'Green Party' },
  { k: 'LAB', s: 'Labour', f: 'Labour Party' },
  { k: 'TPM', s: 'Te Pāti Māori', f: 'Te Pāti Māori' },
  { k: 'TOP', s: 'TOP', f: 'The Opportunities Party (TOP)' },
  { k: 'NZF', s: 'NZ First', f: 'New Zealand First Party' },
  { k: 'NAT', s: 'National', f: 'National Party' },
  { k: 'ACT', s: 'ACT', f: 'ACT New Zealand' },
  { k: 'OTH', s: 'Others', f: 'All other parties' },
];
G.forEach(g => { g.idx = g.k === 'OTH' ? [] : [pi(g.f)]; });
const used = new Set(G.flatMap(g => g.idx));
G[7].idx = P.map((_, i) => i).filter(i => !used.has(i));
const gIndexOfParty = new Array(NP);
G.forEach((g, gi) => g.idx.forEach(i => gIndexOfParty[i] = gi));
const NG = G.length;
const gi = k => G.findIndex(g => g.k === k);
const OPP = [gi('GRN'), gi('LAB'), gi('TPM')], GOV = [gi('NAT'), gi('ACT'), gi('NZF')];
const groupOfPartyName = name => { const i = pi((name || '').trim()); return i < 0 ? NG - 1 : gIndexOfParty[i]; };
const shortParty = name => { const i = pi((name || '').trim()); if (i < 0) return name || 'Independent'; const g = G[gIndexOfParty[i]]; return g.k === 'OTH' ? P[i] : g.s; };

function groups(pv) { const o = new Array(NG).fill(0); for (let i = 0; i < NP; i++) o[gIndexOfParty[i]] += pv[i]; return o; }
const sum = a => a.reduce((s, v) => s + v, 0);
function lean(g) { const o = OPP.reduce((s, i) => s + g[i], 0), r = GOV.reduce((s, i) => s + g[i], 0); return (o + r) ? (r - o) / (r + o) : 0; }

const fmt = n => n.toLocaleString('en-NZ');
const pct = (v, t, d = 1) => t ? (100 * v / t).toFixed(d) + '%' : '–';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nameCase = n => { const [sur, giv] = n.split(', '); const s = sur.split(/([ -])/).map(w => w.length > 1 ? w[0] + w.slice(1).toLowerCase() : w).join(''); return { full: (giv ? giv.split(' ')[0] + ' ' : '') + s, sur: s }; };

// ---------- places + electorates ----------
const places = D.places.map(([lat, lon, sub, addr, e, adv], i) => ({ i, lat, lon, sub, addr, e, adv }));
const E = D.electorates.map(e => {
  const rows = e.rows.map(([k, p, l, pv, pinf, cv, cinf], ri) => ({ ri, k, p, l, pv, pinf, cv, cinf, votes: sum(pv) }));
  const pvTot = new Array(NP).fill(0); rows.forEach(r => r.pv.forEach((v, i) => pvTot[i] += v));
  const cvTot = new Array(e.cands.length).fill(0); rows.forEach(r => r.cv && r.cv.forEach((v, i) => cvTot[i] += v));
  const cands = e.cands.map(([n, party], ci) => ({ ci, n, party, ...nameCase(n), g: groupOfPartyName(party), votes: cvTot[ci] }));
  const order = cands.slice().sort((a, b) => b.votes - a.votes);
  return { ...e, home: e.id <= 65, rows, pvTot, cvTot, cands, winner: order[0], second: order[1], vt: sum(pvTot), ct: sum(cvTot), g: groups(pvTot) };
});
const byId = new Map(E.map(e => [e.id, e]));
const NATIONAL = new Array(NP).fill(0); E.forEach(e => e.pvTot.forEach((v, i) => NATIONAL[i] += v));
document.getElementById('nPlaces').textContent = fmt(places.length);
document.getElementById('nVotes').textContent = fmt(sum(NATIONAL));

// ---------- colours from CSS tokens ----------
let C = {};
function readColours() {
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  C = { sea: v('--sea'), land: v('--land'), coast: v('--coast'), ghost: v('--ghost'), border: v('--border'), ink: v('--ink'), ink2: v('--ink-2'), ink3: v('--ink-3'), panel: v('--panel'), accent: v('--accent'), rule: v('--rule'),
        g: G.map(g => v('--p-' + g.k)), l: v('--lean-l'), m: v('--lean-m'), r: v('--lean-r') };
  LEAN_RAMP = buildLean();
}
const hex2 = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const toHex = a => '#' + a.map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, '0')).join('');

// ---------- interaction: pan, zoom, hover ----------

cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, 2 ** wheelLevels(e)); }, { passive: false });
function zoomAt(px, py, f) { if (live()) { wheelPt = L.point(px, py); wheelTarget = Math.max(lmap.getMinZoom(), Math.min(lmap.getMaxZoom(), (wheelTarget ?? zoomGoal ?? lmap.getZoom()) + Math.log2(f))); applyWheel(); return; } const ns = Math.max(BASE_S() * 0.6, Math.min(MAX_S, V.s * f)); const wx = (px - W / 2) / V.s + V.cx, wy = (py - H / 2) / V.s + V.cy; V.s = ns; V.cx = wx - (px - W / 2) / ns; V.cy = wy - (py - H / 2) / ns; draw(); }
document.getElementById('zin').onclick = () => zoomAt(W / 2, H / 2, 1.6);

const tip = document.getElementById('tip');
function placeTitle(p) { const a = p.addr.split(',')[0]; return a; }
function showTip(d) {

  h += `<div class="t2"><span class="num">${fmt(d.votes)}</span> party votes${!S.e && d.rows.length > 1 ? ` · ${new Set(d.rows.map(x => x.e.id)).size} electorates` : ''}</div>`;
  h += `<div class="t3">${top.map(([v, i]) => `<span class="sw" style="background:${C.g[i]}"></span><span>${G[i].s}</span><span class="num">${pct(v, d.votes)}</span>`).join('')}</div>`;
  if (S.e && S.mode === 'cand' && d.cv && sum(d.cv)) { const ct = sum(d.cv); const c = d.cv.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, 2);

// ---------- selection ----------
function fitView(animate = true) {
  if (S.e) {
    const ds = S.e.home ? DOTS.filter(d => d.p.e === S.e.id) : DOTS;
    if (ds.length) {
      const tot = sum(ds.map(d => d.votes));
      const wq = (key, q) => { const a = ds.map(d => [d.p[key], d.votes]).sort((x, y) => x[0] - y[0]); let c = 0; for (const [v, w] of a) { c += w; if (c >= q * tot) return v; } return a[a.length - 1][0]; };
      const lo = 0.05, hi = 1 - lo;
      const b = [wq('x', lo), wq('y', lo), wq('x', hi), wq('y', hi)];
      const px = (b[2] - b[0]) * 0.08 + 0.01 * U, py = (b[3] - b[1]) * 0.08 + 0.01 * U;
      fitBox([b[0] - px, b[1] - py, b[2] + px, b[3] + py], animate); return;
    }
  }
  fitBox(WORLD, animate);
}
function setElectorate(e, fit = true) {
  S.e = e || null; S.sel = null; S.cand = null; S.tab = 'booths';
  elSel.value = e ? e.id : '';
  try { history.replaceState(null, '', e ? '#e' + e.id : location.pathname); } catch (_) {}
  renderModes(); buildDots(); if (fit) fitView(); else draw(); legend(); renderPanel();
  document.getElementById('panel').scrollTop = 0;
}

}

function bar(gv, tall) {

    h += `<p><b style="color:var(--ink)">${esc(e.winner.full)}</b> (${esc(shortParty(e.winner.party))}) won the electorate vote by <span class="num">${fmt(m)}</span> votes over ${esc(e.second.full)} (${esc(shortParty(e.second.party))}).${e.name === 'Tāmaki Makaurau' ? ' These are official count figures. A judicial recount later cut the majority to 4.' : ''}</p>`; }

function boothsTab(e, geo, off, geoV, offV) {
  // merge rows per place (a venue can be both advance and election-day)
  const ds = DOTS.slice();
  const sorters = { lean: (a, b) => a.lean - b.lean, votes: (a, b) => b.votes - a.votes, name: (a, b) => placeTitle(a.p).localeCompare(placeTitle(b.p)) };
  ds.sort(sorters[S.sort]);
  const home = e.home ? ds.filter(d => d.p.e === e.id) : ds, away = e.home ? ds.filter(d => d.p.e !== e.id) : [];
  const row = d => `<button class="li${S.sel === d.p ? ' sel' : ''}" data-place="${d.p.i}"><span class="nm"><b>${esc(placeTitle(d.p))}</b><span>${d.rows.some(x => x.r.k === 'A') ? '<span class="badge">ADV</span>' : ''}${esc(d.p.sub)}</span></span><span class="v num">${fmt(d.votes)}</span>${bar(d.g)}</button>`;
  let h = `<div class="listhead"><span class="muted" style="font-size:12px">${e.home ? `${home.length} places in the electorate` : `${home.length} voting places took Māori roll votes`} · <span class="num">${pct(geoV, e.vt, 0)}</span> of party votes are on the map</span>
    <div class="seg" role="group" aria-label="Sort voting places">${[['lean', 'Lean'], ['votes', 'Votes'], ['name', 'A–Z']].map(([k, l]) => `<button data-sort="${k}" aria-pressed="${S.sort === k}">${l}</button>`).join('')}</div></div>`;
  if (!e.home) h += `<p style="font-size:12px;padding:0 16px 6px">Māori electorates sit over the general electorates and share their voting places, so this list is every place where ${esc(e.name)} voters cast a vote.</p>`;
  h += `<div class="list">${home.map(row).join('')}</div>`;
  if (away.length) h += `<div class="groupt">Advance votes cast outside the electorate</div><div class="list">${away.map(row).join('')}</div>`;
  const offRows = e.rows.filter(r => r.p < 0 && (S.kind === 'all' || r.k === S.kind || r.k === 'S') && r.votes);
  if (offRows.length) h += `<div class="groupt">Not on the map · ${pct(offV, e.vt, 0)} of party votes</div><div class="list">${offRows.sort((a, b) => b.votes - a.votes).map(r => { const g = groups(r.pv); return `<div class="li" style="cursor:default"><span class="nm"><b>${esc(r.k === 'S' ? r.l : r.l.split(',')[0])}</b><span>${r.k === 'S' ? 'Not tied to a voting place' : 'Mobile or institutional team'}</span></span><span class="v num">${fmt(r.votes)}</span>${bar(g)}</div>`; }).join('')}</div>`;
  return h;
}

function personalTab(e) {
  if (e.cancelled) return `<section class="sec"><p>No electorate vote was taken in ${esc(e.name)} at the general election, so there is no personal vote to compare.</p></section>`;
  const cands = e.cands.filter(c => c.votes).sort((a, b) => b.votes - a.votes);
  const c = S.cand && e.cands[S.cand.ci] === S.cand ? S.cand : cands[0];
  S.cand = c;
  const pidx = pi(c.party.trim());
  let h = `<section class="sec"><div class="row-h"><h3>Candidate vote against party vote</h3><select id="candSel" aria-label="Candidate">${cands.map(x => `<option value="${x.ci}" ${x === c ? 'selected' : ''}>${esc(x.full)} (${esc(shortParty(x.party))})</option>`).join('')}</select></div>`;
  if (pidx < 0) return h + `<p>${esc(c.full)} stood as ${esc(c.party || 'an independent')}, which had no party vote, so there is nothing to compare against. ${esc(c.full)} won ${pct(c.votes, e.ct)} of the electorate vote.</p></section>`;
  const candShare = c.votes / e.ct, partyShare = e.pvTot[pidx] / e.vt;
  const diff = (candShare - partyShare) * 100;
  h += `<div class="stat"><div><span class="big">${(candShare * 100).toFixed(1)}%</span><span class="cap">electorate vote for ${esc(c.sur)}</span></div><div><span class="big">${(partyShare * 100).toFixed(1)}%</span><span class="cap">party vote for ${esc(shortParty(c.party))}</span></div><div><span class="big" style="color:${diff >= 0 ? 'var(--ink)' : 'var(--ink-2)'}">${diff >= 0 ? '+' : '−'}${Math.abs(diff).toFixed(1)}</span><span class="cap">points ${diff >= 0 ? 'ahead of' : 'behind'} the party</span></div></div>`;
  // scatter
  const pts = DOTS.filter(d => d.cv && sum(d.cv) >= 20).map(d => ({ d, x: d.pv[pidx] / d.votes, y: d.cv[c.ci] / sum(d.cv), n: sum(d.cv) }));
  const mx = Math.min(1, Math.ceil(Math.max(0.1, ...pts.map(p => Math.max(p.x, p.y))) * 10) / 10);
  const w = 420, ht = 300, m = { l: 36, r: 12, t: 12, b: 32 };
  const X = v => m.l + v / mx * (w - m.l - m.r), Y = v => ht - m.b - v / mx * (ht - m.t - m.b);
  const ticks = []; for (let t = 0; t <= mx + 1e-9; t += mx > 0.5 ? 0.2 : 0.1) ticks.push(+t.toFixed(2));
  const col = C.g[c.g];
  let svg = `<svg viewBox="0 0 ${w} ${ht}" role="img" aria-label="Scatter of voting places: party vote share on the horizontal axis, candidate vote share on the vertical">`;
  svg += ticks.map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${ht - m.b}" stroke="${C.rule}" stroke-width="1"/><line x1="${m.l}" x2="${w - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${C.rule}" stroke-width="1"/><text x="${X(t)}" y="${ht - m.b + 14}" text-anchor="middle">${Math.round(t * 100)}%</text><text x="${m.l - 6}" y="${Y(t) + 3.5}" text-anchor="end">${Math.round(t * 100)}%</text>`).join('');
  svg += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(mx)}" y2="${Y(mx)}" stroke="${C.ink3}" stroke-dasharray="4 3" stroke-width="1"/>`;
  svg += `<text class="lab" x="${X(mx * 0.04)}" y="${Y(mx * 0.93)}">Candidate ahead of party ↑</text><text class="lab" x="${X(mx * 0.96)}" y="${Y(mx * 0.06)}" text-anchor="end">Party ahead of candidate ↓</text>`;
  svg += `<text class="lab" x="${(m.l + w - m.r) / 2}" y="${ht - 4}" text-anchor="middle">${esc(shortParty(c.party))} share of party vote</text>`;
  pts.sort((a, b) => b.n - a.n).forEach(p => { svg += `<circle data-place="${p.d.p.i}" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${Math.min(9, 2 + Math.sqrt(p.n) / 6).toFixed(1)}" fill="${col}" fill-opacity="${S.sel === p.d.p ? 1 : 0.55}" stroke="${S.sel === p.d.p ? C.accent : C.panel}" stroke-width="${S.sel === p.d.p ? 2.5 : 1}"><title>${esc(placeTitle(p.d.p))}: ${esc(c.sur)} ${(p.y * 100).toFixed(1)}%, ${esc(shortParty(c.party))} ${(p.x * 100).toFixed(1)}%</title></circle>`; });
  svg += `</svg>`;
  h += `<div class="chart" id="scatter">${svg}</div><p style="font-size:12px">Each circle is a voting place with at least 20 electorate votes, sized by votes. Above the dashed line, ${esc(c.sur)} won more electorate votes than ${esc(shortParty(c.party))} won party votes.</p></section>`;
  const gaps = pts.filter(p => p.n >= 50).map(p => ({ ...p, g: p.y - p.x })).sort((a, b) => b.g - a.g);
  const lst = (arr, t) => arr.length ? `<div class="groupt">${t}</div><div class="list">${arr.map(p => `<button class="li${S.sel === p.d.p ? ' sel' : ''}" data-place="${p.d.p.i}"><span class="nm"><b>${esc(placeTitle(p.d.p))}</b><span>${esc(c.sur)} ${(p.y * 100).toFixed(0)}% · ${esc(shortParty(c.party))} ${(p.x * 100).toFixed(0)}%</span></span><span class="v num">${p.g >= 0 ? '+' : '−'}${Math.abs(p.g * 100).toFixed(1)}</span>${bar(p.d.g)}</button>`).join('')}</div>` : '';
  h += lst(gaps.slice(0, 5), `Biggest personal vote for ${esc(c.sur)}`);
  h += lst(gaps.slice(-5).reverse().filter(p => p.g < 0), `Where ${esc(shortParty(c.party))} ran furthest ahead`);
  return h;
}

function splitTab(e) {
  const sp = e.split; if (!sp || !sp.rows.length) return '<section class="sec"><p>No split-vote data for this electorate.</p></section>';
  const totalRow = sp.rows.find(r => r[0].startsWith('Total'));
  // columns: candidates with ≥1.5% overall, others merged; plus party-vote-only
  const colInfo = sp.cols.map((c, j) => ({ j, c, tot: totalRow ? totalRow[2 + j] : 0 }));
  const keep = colInfo.filter(x => typeof x.c === 'number' && x.tot >= 1.5).sort((a, b) => b.tot - a.tot);
  const rest = colInfo.filter(x => typeof x.c === 'number' && x.tot < 1.5);
  const pvo = colInfo.find(x => x.c === 'Party Vote Only'), inf = colInfo.find(x => x.c === 'Informal Candidate Votes');
  const rows = sp.rows.filter(r => !r[0].startsWith('Total') && !r[0].startsWith('Informal') && r[1] / e.vt >= 0.01).sort((a, b) => b[1] - a[1]);
  const cell = (v, own) => { const a = Math.min(1, v / 100); const bg = `color-mix(in oklab, var(--ink) ${Math.round(a * 85)}%, var(--panel))`; return `<td class="${own ? 'own' : ''}" style="background:${bg};color:${a > .5 ? 'var(--panel)' : 'var(--ink)'}">${v >= 0.5 ? v.toFixed(0) : v > 0 ? '·' : ''}</td>`; };
  let h = `<section class="sec"><h3>Where each party's voters gave their electorate vote</h3><p style="font-size:12.5px">Read across a row: of everyone who gave ${esc(e.name)}'s party vote to that party, the percentage who gave their electorate vote to each candidate. Outlined cells are the party's own candidate. This table is for the whole electorate and isn't broken down by voting place.</p>`;
  if (e.cancelled) return h + `<p>The electorate poll was cancelled, so there is no split to show.</p></section>`;
  h += `<div class="mx"><table><thead><tr><th class="rh">Party vote</th><th>Votes</th>${keep.map(x => { const c = e.cands[x.c]; return `<th><span class="ch"><span class="sw" style="background:${C.g[c.g]}"></span>${esc(c.sur)}</span></th>`; }).join('')}${rest.length ? '<th>Others</th>' : ''}${pvo ? '<th>Party<br>only</th>' : ''}</tr></thead><tbody>`;
  for (const r of rows) {
    const pIdx = pi(r[0]);
    h += `<tr><th class="rh"><span class="key"><span class="sw" style="background:${C.g[pIdx < 0 ? NG - 1 : gIndexOfParty[pIdx]]}"></span>${esc(shortParty(r[0]))}</span></th><td style="color:var(--ink-2)">${fmt(r[1])}</td>${keep.map(x => cell(r[2 + x.j], e.cands[x.c].party.trim() === r[0].trim())).join('')}${rest.length ? cell(rest.reduce((s, x) => s + r[2 + x.j], 0) + (inf ? r[2 + inf.j] : 0), false) : ''}${pvo ? cell(r[2 + pvo.j], false) : ''}</tr>`;
  }
  h += `</tbody></table></div><p style="font-size:12px">Parties with at least 1% of the party vote. “Others” includes minor candidates and informal electorate votes. “Party only” counts votes where only the party vote could be counted, for example special votes from people enrolled for a different electorate.</p></section>`;
  return h;
}

function renderPanel() {
  const panel = document.getElementById('panel');
  panel.innerHTML = (S.e ? electoratePanel() : nationalPanel()) + `<section class="sec" style="font-size:11.5px;color:var(--ink-3)">Results: Electoral Commission, 2023 General Election official results. Voting place locations are approximate. Coastline: Land Information New Zealand (Topo 1:50k), CC BY 4.0. Electorate boundaries: Stats NZ (2020), CC BY 4.0.</section>`;
  const ss = document.getElementById('strongSel'); if (ss) ss.onchange = () => { S.party = +ss.value; partySel.value = S.party; buildDots(); draw(); legend(); renderPanel(); };
  const cs = document.getElementById('candSel'); if (cs) cs.onchange = () => { S.cand = S.e.cands[+cs.value]; renderPanel(); };
}
const panelEl = document.getElementById('panel');
panelEl.addEventListener('click', ev => {
  const t = ev.target.closest('[data-place],[data-e],[data-act],[data-tab],[data-sort]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; renderPanel(); return; }
  if (t.dataset.sort) { S.sort = t.dataset.sort; renderPanel(); return; }
  if (t.dataset.act === 'national') { setElectorate(null); return; }
  if (t.dataset.act === 'clearsel') { selectPlace(null); return; }
  if (t.dataset.e) { setElectorate(byId.get(+t.dataset.e)); return; }
  if (t.dataset.place) { const p = places[+t.dataset.place]; selectPlace(S.sel === p ? null : p, false); centreOn(p); }
});
panelEl.addEventListener('pointerover', ev => { const t = ev.target.closest('[data-place]'); const p = t ? places[+t.dataset.place] : null; if (p !== S.hover) { S.hover = p; draw(); const d = DOTS.find(x => x.p === p); if (d && d.sx > 0 && d.sx < W && d.sy > 0 && d.sy < H) showTip(d); else hideTip(); } });
panelEl.addEventListener('pointerleave', () => { S.hover = null; hideTip(); draw(); });
function centreOn(p) { const x = sx(p.x), y = sy(p.y); if (x > 40 && x < W - 40 && y > 60 && y < H - 60) return; animateTo({ cx: p.x, cy: p.y, s: Math.max(V.s, BASE_S() * 6) }); }

// ---------- boot ----------
if (lmap) {
  const seg = document.getElementById('bmSeg'); seg.hidden = false;
  seg.onclick = e => { const b = e.target.closest('button'); if (b) setBasemap(b.dataset.bm === 'on'); };
}
window.__bi = { V, get lmap() { return lmap; }, get wheelPt() { return wheelPt; }, places, proj, sx: x => sx(x), sy: y => sy(y), get dots() { return DOTS; } }; // debugging hook
readColours();
const mo = new MutationObserver(() => { readColours(); setTiles(); draw(); legend(); renderPanel(); });
mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColours(); setTiles(); draw(); legend(); renderPanel(); });
new ResizeObserver(() => { const first = !W; resize(); if (first) { fitView(false); let pref = null; try { pref = localStorage.getItem('bi-streetmap'); } catch (_) {} if (pref === 'off') setBasemap(false, false); } }).observe(wrap);
const h0 = /^#e(\d+)$/.exec(location.hash);
renderModes();
if (h0 && byId.get(+h0[1])) { S.e = byId.get(+h0[1]); elSel.value = S.e.id; renderModes(); }
buildDots(); legend(); renderPanel();
document.fonts && document.fonts.ready.then(() => draw());
})();
</script>
